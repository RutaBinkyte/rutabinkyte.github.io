name: Build and publish academic site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_scholar:
        description: Refresh Google Scholar before publishing
        type: boolean
        default: false
  schedule:
    - cron: '27 6 * * 1'
permissions:
  contents: read
concurrency:
  group: academic-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete Scholar snapshot
        if: github.event_name == 'schedule' || inputs.refresh_scholar == true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/sync_scholar.py
      - name: Install CV compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends texlive-xetex fonts-dejavu-core
      - name: Build HTML and CV
        run: python scripts/build.py
      - name: Persist publication snapshot and CV for subsequent builds
        run: |
          git add data/scholar-cache.json cv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh academic site data"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish built pages
        id: publish
        uses: actions/deploy-pages@v4
